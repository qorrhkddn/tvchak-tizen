<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>TVChak 실행기</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <iframe id="web-client" title="TVChak NAS 웹" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <main id="connection-screen">
    <form id="connection-form">
      <h1>TVChak</h1>
      <p>화면은 NAS에서 불러옵니다. 앞으로는 NAS 웹만 배포하면 됩니다.</p>
      <label for="nas-url">NAS 주소</label>
      <input id="nas-url" type="text" inputmode="url" autocomplete="url" spellcheck="false"
             placeholder="http://ramel.local:7777">
      <div class="actions">
        <button id="connect" type="submit">연결</button>
        <button id="change-address" type="button">주소 변경</button>
      </div>
      <p id="connection-status" role="status" aria-live="polite">NAS 연결을 준비합니다.</p>
      <p class="hint">같은 네트워크의 NAS가 켜져 있어야 합니다. iOS는 NAS의 /web/을 홈 화면에 추가하세요.</p>
    </form>
  </main>
  <script src="../app/host-bridge.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
